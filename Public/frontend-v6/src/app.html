<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <link rel="mask-icon" href="%sveltekit.assets%/favicon.svg" color="#F27A1A" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icons/icon-180.png" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Chhath Puja" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script>
      (function (w, d, s, l, i) {
        w[l] = w[l] || [];
        w[l].push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
        var f = d.getElementsByTagName(s)[0], j = d.createElement(s), dl = l != 'dataLayer' ? '&l=' + l : '';
        j.async = true; j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i + dl;
        f.parentNode.insertBefore(j, f);
      })(window, document, 'script', 'dataLayer', 'GTM-N6BF7NP7');
    </script>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Chhath Puja Transparency Portal" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#F27A1A" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)" />
    <script>
      (function () {
        try {
          var LIGHT = { sunrise: 1, 'classic-light': 1, 'slate-light': 1, festival: 1, 'executive-pro': 1, 'pastel-zen': 1, 'heritage-serif': 1 };
          var DARK = { 'warm-night': 1, 'slate-dark': 1, midnight: 1, aurora: 1, 'neon-noir': 1, 'cyber-lime': 1, 'sunset-vapor': 1, 'mint-frost': 1, 'midnight-glass': 1, 'festival-dark': 1, 'heritage-serif-dark': 1, 'surya-ghat': 1 };
          var DEFAULT_LIGHT = 'sunrise';
          var DEFAULT_DARK = 'warm-night';
          var id = localStorage.getItem('cpm_public_v5_theme');
          if (!id || (!LIGHT[id] && !DARK[id])) {
            var m = window.matchMedia;
            if (m && m('(prefers-color-scheme: dark)').matches) id = DEFAULT_DARK;
            else if (m && m('(prefers-color-scheme: light)').matches) id = DEFAULT_LIGHT;
            else id = Math.random() < 0.5 ? DEFAULT_LIGHT : DEFAULT_DARK;
          }
          var root = document.documentElement;
          root.setAttribute('data-theme', id);
          root.classList.toggle('dark', !!DARK[id]);
          var l = localStorage.getItem('cpm_public_lang') === 'hi' ? 'hi' : 'en';
          root.setAttribute('lang', l);
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Kalam:wght@400;700&family=Playfair+Display:wght@600;700;800&display=swap" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Kalam:wght@400;700&family=Playfair+Display:wght@600;700;800&display=swap" /></noscript>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" class="bg-slate-100 dark:bg-ink">
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N6BF7NP7" height="0" width="0" style="display: none; visibility: hidden" title="Google Tag Manager"></iframe></noscript>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
