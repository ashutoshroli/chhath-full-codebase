<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <link rel="mask-icon" href="%sveltekit.assets%/favicon.svg" color="#F27A1A" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icons/icon-180.png" />
    <!-- Static manifest link so crawlers / PWABuilder see it pre-hydration; the
         layout also injects the @vite-pwa/sveltekit-generated link at runtime. -->
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Chhath Puja" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Google Tag Manager (container GTM-N6BF7NP7). GA4 and Microsoft Clarity
         run as TAGS INSIDE this single container, so only ONE snippet is
         installed. Hardcoded id: app.html is a static template that cannot read
         Vite env. gtm.js loads from Google's CDN and is not bundled. -->
    <script>
      (function (w, d, s, l, i) {
        w[l] = w[l] || [];
        w[l].push({ 'gtm.start': new Date().getTime(), 'event': 'gtm.js' });
        var f = d.getElementsByTagName(s)[0],
          j = d.createElement(s),
          dl = l != 'dataLayer' ? '&l=' + l : '';
        j.async = true;
        j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i + dl;
        f.parentNode.insertBefore(j, f);
      })(window, document, 'script', 'dataLayer', 'GTM-N6BF7NP7');
    </script>
    <!-- End Google Tag Manager -->

    <!-- Default SEO / social preview (per-page <title>/<meta> override these). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Chhath Puja Transparency Portal" />
    <!-- audit PR-42: og:title / og:description / og:image / og:url are emitted PER ROUTE by
         src/lib/components/Seo.svelte. They used to be hard-coded here, so every share of every
         page previewed as the home page, and there was no og:url at all. Two competing og:title
         tags is worse than one wrong one, so the duplicates are gone from here. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#F27A1A" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)" />

    <!-- No-flash theme + language: runs BEFORE first paint (no light->dark
         flicker). v5 multi-theme: apply the saved theme id if valid; else pick a
         default from the device dark/light preference; else (no signal) random.
         Sets data-theme + the `dark` class. Must mirror src/lib/themes.ts. -->
    <script>
      (function () {
        try {
          var LIGHT = { sunrise: 1, 'classic-light': 1, 'slate-light': 1, festival: 1, 'executive-pro': 1, 'pastel-zen': 1, 'heritage-serif': 1 };
          var DARK = { 'warm-night': 1, 'slate-dark': 1, midnight: 1, aurora: 1, 'neon-noir': 1, 'cyber-lime': 1, 'sunset-vapor': 1, 'mint-frost': 1, 'midnight-glass': 1, 'festival-dark': 1, 'heritage-serif-dark': 1, 'surya-ghat': 1 };
          var DEFAULT_LIGHT = 'sunrise';
          var DEFAULT_DARK = 'warm-night';
          var id = localStorage.getItem('cpm_public_v5_theme');
          if (!id || (!LIGHT[id] && !DARK[id])) {
            var m = window.matchMedia;
            if (m && m('(prefers-color-scheme: dark)').matches) id = DEFAULT_DARK;
            else if (m && m('(prefers-color-scheme: light)').matches) id = DEFAULT_LIGHT;
            else id = Math.random() < 0.5 ? DEFAULT_LIGHT : DEFAULT_DARK;
          }
          var root = document.documentElement;
          root.setAttribute('data-theme', id);
          root.classList.toggle('dark', !!DARK[id]);
          var l = localStorage.getItem('cpm_public_lang') === 'hi' ? 'hi' : 'en';
          root.setAttribute('lang', l);
        } catch (e) {}
      })();
    </script>

    <!-- Fonts: non-render-blocking (print->all swap) so first paint is not
         blocked on the network. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Kalam:wght@400;700&family=Playfair+Display:wght@600;700;800&display=swap"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Kalam:wght@400;700&family=Playfair+Display:wght@600;700;800&display=swap"
      />
    </noscript>

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" class="bg-slate-100 dark:bg-ink">
    <!-- Google Tag Manager (noscript) -->
    <noscript
      ><iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-N6BF7NP7"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
        title="Google Tag Manager"
      ></iframe
    ></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
