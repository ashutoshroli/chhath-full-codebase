name = "chhath-public-api"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
# CORS allow-list (comma-separated EXACT origins). When set, only these origins get an
# Access-Control-Allow-Origin reflection; leave unset (or "*") for the wildcard. For
# the READ actions a wildcard is fine — this is a public, read-only portal.
#
# SET THIS ANYWAY. Since audit PUB-BE-06 this variable is also the authenticity check
# on the two WRITE actions (`logError`, `savePushSubscription`), which are anonymous by
# necessity:
#
#   configured -> a write must carry an Origin ON THIS LIST. This is the real control.
#   unset      -> a write must still carry SOME Origin (every browser sends one on a
#                 cross-origin POST, so a real visitor is unaffected) and must declare
#                 `Content-Type: application/json`, which forces a preflight. That is a
#                 floor that stops the trivial scripted flood; it is NOT equivalent to
#                 naming your portal's origin here.
#
# Without it, anyone can keep inserting rows into `error_log` — the table the committee
# reads to find out whether the public site is broken — and can reactivate a push
# subscription a visitor had switched off.
# ALLOWED_ORIGINS = "https://YOUR-PUBLIC-PORTAL-DOMAIN.example.com"

# HEALTH_TOKEN is a SECRET, so it is deliberately NOT set here — run
#     wrangler secret put HEALTH_TOKEN
# It gates the per-dependency detail of the readiness probe
# (`GET /?health=1&deep=1`, header `X-Health-Token`). Without it, readiness still
# answers ready/degraded and the dependency STATES, but the underlying error
# messages are withheld from the response and written to error_log instead — a D1
# error string can echo table names and database identifiers, which an anonymous
# caller has no business reading.
#
# Point uptime monitors at plain `GET /?health=1` (liveness): it performs NO I/O,
# so polling it costs no database round-trips.

# READ-ONLY scope by convention (see MIGRATION_NOTES.md) — this Worker's code
# issues no INSERT/UPDATE/DELETE except the two narrow, documented exceptions
# below, but D1 bindings themselves don't have a separate read-only permission
# mode yet. If Cloudflare ships read-only D1 tokens before you deploy this, use
# one here for defense in depth.
#
# The two write exceptions, both single-table and both in src/index.js:
#   1. DB_LOGS  -> INSERT into `error_log` only (see the DB_LOGS note below).
#   2. DB_CORE  -> upsert into `push_subscriptions` only. A visitor opting in to
#      push notifications can only reach THIS Worker (the mgmt Worker is locked to
#      the mgmt origins and needs a session), so the subscription is stored here.
#      Only the subscription is written; SENDING — and therefore the VAPID PRIVATE
#      key — stays in the mgmt Worker, which binds the same physical database.

# KV — used for two lightweight guards (hardening A + C): a per-IP request rate
# limit, and a daily D1 read-budget counter that makes the public portal serve from
# cache (instead of hitting D1) once the day's reads approach the free-tier limit —
# so a flood of public requests can no longer exhaust D1 and take the whole portal
# (mgmt included) offline. Also holds the last-known-good portalData snapshot.
#
# ⚠️ SECURITY (audit H-4) — THIS USED TO BE THE MGMT WORKER'S NAMESPACE.
# Both wrangler.toml files carried the SAME id (fc720867ed48459bb723279a56767711),
# which meant this PUBLIC, unauthenticated Worker held a read/write binding to the
# namespace storing live mgmt sessions, the Google Drive OAuth access token, cached
# member PII (mgmtcache:*), login lockout counters and consent OTP proofs. The only
# thing keeping it away from them was the "pub:" prefix convention — a comment, not
# a boundary. It also meant the two Workers competed for the same ~1000/day KV write
# budget, which this file already documents as a real outage cause.
#
# ---- SETUP: DONE, NOTHING TO DO ----
# The dedicated namespace was created with
#
#     wrangler kv namespace create PUBLIC_CACHE
#
# and the id it printed is bound below. Note that KV_SESSIONS is deliberately NOT
# bound in this file any more, and that absence is the actual boundary: this
# Worker now has no route at all to mgmt sessions, the Drive OAuth token, cached
# member PII or consent OTP proofs, and no longer competes for the mgmt Worker's
# ~1000/day KV write budget.
#
# The code stays migration-safe — pubKv() in src/index.js prefers env.KV_PUBLIC and
# falls back to env.KV_SESSIONS — but with KV_SESSIONS unbound here that fallback
# is now unreachable for this Worker, which is the intent.
#
# On the first request after deploying, the new namespace is empty, so the
# last-known-good portalData snapshot is missing and gets rebuilt from D1. Every
# key this Worker writes (pub:rl:*, pub:d1reads:*, pub:snapshot:*) is a cache or a
# counter that regenerates itself on first use, so nothing is lost; the old
# namespace's copies are simply abandoned and expire on their TTLs.
[[kv_namespaces]]
binding = "KV_PUBLIC"
id = "dce0bc8851694b7883030edd6643859e"

[[d1_databases]]
binding = "DB_CORE"
database_name = "chhath-core"
database_id = "06edd936-b186-47f3-93fb-72f0dc840849"  # same DB as mgmt-worker's DB_CORE

[[d1_databases]]
binding = "DB_COLLECTIONS"
database_name = "chhath-collections"
database_id = "6a1fb670-ec32-457a-b90f-635b33afc67c"

[[d1_databases]]
binding = "DB_LOANS_EXPENSES"
database_name = "chhath-loans-expenses"
database_id = "ef3e1e5d-1254-488c-9d6e-8a5121a613c9"

[[d1_databases]]
binding = "DB_FILE_INDEX"
database_name = "chhath-file-index"
database_id = "958869d9-78bf-48ba-9c31-c2c6271b52eb"

# Bound ONLY for the "Public" popup feature — the Worker code (index.js's
# getActivePublicPopups) only ever queries the `popups` and `popup_slides`
# tables from this DB, never anything else in `misc` (announcements, popup
# management internals, etc.). D1 bindings are per-database not per-table, so
# this comment is the enforcement boundary — don't add new queries against
# DB_MISC here without keeping that "only these 2 tables" rule.
[[d1_databases]]
binding = "DB_MISC"
database_name = "chhath-misc"
database_id = "a9298585-e108-4f7e-b555-7da7fc0a1921"  # same DB as mgmt-worker's DB_MISC

# DB_LOGS is now bound — and it is the ONE exception to the read-only rule above.
#
# Previously it was deliberately left out, which meant this Worker could not write
# anywhere: the fetch handler had no try/catch, so any D1 failure became a
# Cloudflare "1101 Worker threw exception" that nobody ever saw, and the public
# frontend had no error reporting at all. The entire public transparency portal —
# backend AND frontend — was invisible to the committee.
#
# Scope rule (same enforcement-by-comment convention as DB_MISC above): this
# Worker only ever INSERTs into the `error_log` table (and SELECTs from it purely
# to de-duplicate). It must never read or write anything else in this DB.
[[d1_databases]]
binding = "DB_LOGS"
database_name = "chhath-logs"
database_id = "b4204316-e268-4fc3-bb4c-922cd291fb22"  # same DB as mgmt-worker's DB_LOGS

# Deliberately NOT bound here: DB_TEMPLATES, DB_WHATSAPP_INDEX
