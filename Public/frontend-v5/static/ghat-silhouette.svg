      <path d="M420 300 v-40 a10 10 0 0 1 20 0 v40 z M430 250 a8 8 0 1 1 .1 0 z"/>
      <path d="M470 300 v-34 a9 9 0 0 1 18 0 v34 z M479 258 a7 7 0 1 1 .1 0 z"/>
      <path d="M900 300 v-40 a10 10 0 0 1 20 0 v40 z M910 250 a8 8 0 1 1 .1 0 z"/>
      <path d="M950 300 v-32 a9 9 0 0 1 18 0 v32 z M959 260 a7 7 0 1 1 .1 0 z"/>
    </g>
  </g>
</svg>
