# Runs the checks that every audit-fix PR has been verifying by hand.
#
# The point is not coverage metrics — it is that the specific defects fixed in
# PRs #68-#84 cannot come back silently. Each job below corresponds to a class of
# bug that shipped to production at least once in this repo:
#
#   backend-tests   the 220 behavioural assertions (privilege escalation, leaked
#                   consent tokens, id collisions, non-atomic writes, session
#                   revocation, subrequest counts, KV write budgets)
#   error-typing    audit H-3: a bare `throw new Error` is untyped, so the router
#                   turns a blank-field message into a logged HTTP 500
#   syntax          `node --check` on every Worker file. A syntax error here is
#                   only caught at `wrangler deploy`, i.e. in production
#   frontend-build  the mgmt SPA must build, and the main chunk must not balloon
#   migrations      every .sql migration must apply against the committed schema
#                   and be re-runnable
#   no-real-data    the PII dumps under mgmt/db/migration/ must never be committed
#                   (GitGuardian has flagged this repo for exactly that before)
#   public-harness  the public Worker under workerd, on real D1/KV/Cache. Separate job
#                   because it installs the workerd binary; the fast checks above must
#                   not wait for it
#   render-service  the Render offload service's own suite. It existed and CI never ran
#                   it, so nothing caught a Worker/Render contract change breaking the
#                   separately-deployed, auto-deploying service
#
# Deliberately NOT here: `wrangler deploy`, `npm audit --audit-level=high` as a
# hard gate (one unfixable transitive advisory is handled by an npm override and
# documented in mgmt/frontend/package.json), and any job needing a Cloudflare
# token. CI must not be able to touch production.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Worker tests, error typing and syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # node:sqlite (the D1 stub the tests run against) needs Node 22+.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The suite imports the Worker source directly and stubs D1 with
      # node:sqlite and KV with a Map — no dependencies, nothing to install.
      - name: Worker test suite
        working-directory: mgmt/backend
        run: npm test

      # audit H-3. A bare `throw new Error(...)` is untyped, so index.js treats it
      # as an unexpected server fault: HTTP 500, the message replaced by
      # "Something went wrong on the server", and a row in error_log. Every throw
      # must say which it is — ValidationError (user-facing, 400, not logged) or
      # InternalError (server fault, 500, logged).
      - name: No untyped throws
        working-directory: mgmt/backend
        run: npm run lint:errors

      # The public Worker's first tests (audit PUB-BE-01/02). They import
      # Public/backend/src/index.js directly and stub D1, KV and the Cache API, so
      # there is nothing to install and no lockfile is needed yet. What they pin is
      # the contract that protects the D1 daily row quota this Worker SHARES with
      # the management API: one canonical cache key per (action, version), and one
      # allowed HTTP method per action.
      - name: Public Worker test suite
        working-directory: Public/backend
        run: npm test

      # A syntax error in a Worker file is otherwise found by `wrangler deploy`,
      # which means it is found in production.
      - name: Syntax check every Worker file
        run: |
          set -e
          for f in mgmt/backend/src/*.js Public/backend/src/*.js; do
            node --check "$f"
          done
          echo "node --check OK: $(ls mgmt/backend/src/*.js Public/backend/src/*.js | wc -l) files"

  # The Render offload service's own suite. audit Render/offload #11: these tests have
  # existed and CI has never run them, so nothing stopped a change to the Worker/Render
  # contract from breaking the service that is deployed separately and auto-deploys.
  #
  # Brought forward from PR-46 (CI gates) because the byte-contract work in this wave is
  # unverifiable without it: half the contract is enforced HERE, and a test nobody runs
  # is documentation.
  render-service:
    name: Render service tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No lockfile in this service yet (audit Render/offload #10 — it resolves semver at
      # deploy time and auto-deploys, which is its own finding and its own PR). `npm
      # install` is therefore what reproduces what Render actually runs today.
      - name: Install
        working-directory: mgmt/server-render
        run: npm install --no-audit --no-fund

      - name: Test suite
        working-directory: mgmt/server-render
        run: npm test

  # The public Worker running for real: workerd, real D1 built from the committed
  # schema in mgmt/db/schema/, real KV and the real Cache API (audit PUB-BE-08).
  #
  # A SEPARATE job on purpose. It needs an `npm ci` that downloads the workerd binary,
  # so folding it into `backend` above would slow down the suite everyone waits on for
  # every push. The two are complementary: `backend` proves the logic in a second with
  # nothing installed, this proves it against the platform's real rules — the Cache API
  # refusing a response with no freshness information, refusing a non-GET key, real D1
  # errors, real preflight handling.
  public-harness:
    name: Public Worker — workerd integration harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Public/backend/package-lock.json

      # `npm ci` and not `npm install`: the lockfile pins the exact miniflare (and so the
      # exact workerd) the assertions were written against, plus the two `overrides` that
      # clear HIGH advisories in miniflare's tree — see the notes in package.json.
      - name: Install
        working-directory: Public/backend
        run: npm ci

      - name: Integration harness (every action, on real bindings)
        working-directory: Public/backend
        run: npm run test:integration

  frontend:
    name: mgmt SPA build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mgmt/frontend/package-lock.json

      # `npm ci` and not `npm install`: the package.json `overrides` block
      # redirects the deprecated `xmldom` (CRITICAL advisories, no upstream fix)
      # to @xmldom/xmldom. The lockfile is what pins that, so it must be honoured.
      - name: Install
        working-directory: mgmt/frontend
        run: npm ci

      - name: Build
        working-directory: mgmt/frontend
        run: npm run build

      # The main entry chunk is loaded by every visitor on a phone over rural
      # mobile data, so a regression here is a real cost. ~191 kB is the current
      # size; the limit is a warning threshold, not a target to grow into.
      - name: Report and bound the main chunk size
        working-directory: mgmt/frontend
        run: |
          set -e
          MAIN=$(ls -S dist/assets/index-*.js | head -1)
          BYTES=$(wc -c < "$MAIN")
          # 1 kB = 1000 B, the same convention Vite uses, so this figure is
          # comparable to the ~190.6 kB quoted in the audit-fix PRs. It reads a few
          # hundred bytes higher than Vite's own line because Vite measures the
          # chunk it generated and this measures the file on disk.
          KB=$(awk -v b="$BYTES" 'BEGIN { printf "%.2f", b / 1000 }')
          echo "main chunk: $MAIN — ${KB} kB (${BYTES} bytes)"
          echo "### mgmt SPA main chunk: ${KB} kB" >> "$GITHUB_STEP_SUMMARY"
          # 230,000 B is a warning threshold with ~20% headroom over today's
          # 190.6 kB — not a target to grow into.
          LIMIT_BYTES=230000
          if [ "$BYTES" -gt "$LIMIT_BYTES" ]; then
            echo "::error::main chunk is ${KB} kB, over the ${LIMIT_BYTES} byte budget."
            echo "Check what was pulled into the entry chunk — the heavy libraries"
            echo "(docxtemplater, jspdf, html2canvas) must stay lazily imported."
            exit 1
          fi

  migrations:
    name: SQL migrations apply and are idempotent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # This step scans EVERY migration folder, not just the newest one (carry-over C6:
      # "migration CI only scans 2026-09-05/ — older folders have uncovered files, and
      # widening it fails today"). Widening it did fail, on twelve files, and the reasons
      # are now declared in test/migration-matrix.test.mjs:
      #
      #   * nine apply against one committed schema, twice;
      #   * two carry indexes for THREE different D1 databases and cannot be applied as a
      #     whole file at all — the matrix applies them section by section, as their own
      #     headers instruct;
      #   * one is already reflected in the committed schema, so a fresh apply can only fail
      #     on the duplicate column — which the matrix asserts, so we know rather than guess.
      #
      # A NEW migration in ANY folder now fails here until someone has said which database it
      # targets and what applying it is supposed to do. That is the mistake that would
      # otherwise let an unverified migration reach a live database.
      - name: Every migration in every folder is covered by a test
        run: |
          set -e
          missing=0
          for f in mgmt/db/migration/*/*.sql; do
            base=$(basename "$f")
            if ! grep -q "$base" mgmt/backend/test/*.test.mjs; then
              echo "::error file=$f::$base is not referenced by any test."
              echo "Declare it in test/migration-matrix.test.mjs (DECLARED) — or, for the"
              echo "2026-09-05 folder, in SCHEMA_FOR_MIGRATION in"
              echo "test/h10-m38-indexes-and-retention.test.mjs — so CI proves what applying"
              echo "it does against the committed schema."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] && echo "all migrations, in all $(ls -d mgmt/db/migration/*/ | wc -l) folders, are covered"

      - name: Run the migration tests
        working-directory: mgmt/backend
        run: |
          node --test \
            test/migration-matrix.test.mjs \
            test/migration-target-databases.test.mjs \
            test/pr34-enforced-keys-and-relations.test.mjs \
            test/pr35-migration-ledger.test.mjs \
            test/h10-m38-indexes-and-retention.test.mjs \
            test/h9-atomic-id-allocation.test.mjs \
            test/rebuild-and-seed.test.mjs

  public-frontend-v6:
    name: Public v6 — type-check, tests and static build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Public/frontend-v6/package-lock.json

      - name: Install
        working-directory: Public/frontend-v6
        run: npm ci

      - name: Type-check (svelte-check)
        working-directory: Public/frontend-v6
        run: npm run check

      - name: Unit tests (derive / ranking / schema / themes)
        working-directory: Public/frontend-v6
        run: npm test

      - name: Static build (adapter-static + PWA)
        working-directory: Public/frontend-v6
        run: npm run build

      # This is the PUBLIC portal — opened by every visitor, most of them on a phone
      # over rural mobile data, so its JavaScript weight is a real cost to real
      # people. The mgmt SPA has had a budget since the audit; these two SvelteKit
      # apps had none, so nothing stopped either from growing.
      #
      # TWO numbers are bounded, because they answer different questions and they
      # came apart badly here:
      #
      #  * TOTAL client JS — "is the app growing?" Guards against a dozen route
      #    chunks quietly doubling the app while an entry-chunk budget stays green.
      #  * FIRST-LOAD JS (PR-45) — "what does a visitor pay to open one page?"
      #    Before PR-45 the total was 622 kB and every page pulled 583-603 kB of it,
      #    because the skin registry statically imported all five skins. The total
      #    looked fine; the thing visitors actually experience did not. Splitting
      #    the skins moved the worst page to 380 kB while the TOTAL went UP 2.6%
      #    (more, smaller chunks) — which is why a total-only budget would have
      #    recorded this improvement as a regression.
      - name: Bound the client bundle
        working-directory: Public/frontend-v6
        run: |
          set -e
          BYTES=$(find build/_app/immutable -name '*.js' -type f -printf '%s\n' | awk '{t+=$1} END {print t+0}')
          KB=$(awk -v b="$BYTES" 'BEGIN { printf "%.1f", b / 1000 }')
          BIGGEST=$(find build/_app/immutable -name '*.js' -type f -printf '%s %p\n' | sort -rn | head -1)
          echo "total client JS: ${KB} kB (${BYTES} bytes); largest chunk: ${BIGGEST}"
          echo "### Public v6 client JS: ${KB} kB (largest chunk: ${BIGGEST%% *} B)" >> "$GITHUB_STEP_SUMMARY"
          # ~10% headroom over today's 638,706 B — a regression threshold, not a target.
          LIMIT_BYTES=700000
          if [ "$BYTES" -gt "$LIMIT_BYTES" ]; then
            echo "::error::Public v6 client JS is ${KB} kB, over the ${LIMIT_BYTES} byte budget."
            echo "Every public visitor downloads this. Check what stopped being lazily imported."
            exit 1
          fi

      # Per-page critical-path JS: the modules the prerendered HTML names, PLUS
      # everything they statically import, transitively. Reading only the
      # `modulepreload` hints (as this gate first did) under-counts by an amount
      # that depends on the bundler — 810 B under vite 5, 11,109 B under vite 8 —
      # so it could not be used to compare two builds. ~10% headroom over today's
      # worst page, 380,683 B. See scripts/first-load-bytes.mjs.
      - name: Bound first-load JS per page
        working-directory: Public/frontend-v6
        run: |
          set -e
          node scripts/first-load-bytes.mjs --limit 420000 | tee /tmp/first-load.txt
          echo '### Public v6 first-load JS' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/first-load.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  mgmt-frontend-svelte:
    name: mgmt SvelteKit — type-check, tests and static build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mgmt/frontend-svelte/package-lock.json

      - name: Install
        working-directory: mgmt/frontend-svelte
        run: npm ci

      - name: Type-check (svelte-check)
        working-directory: mgmt/frontend-svelte
        run: npm run check

      - name: Unit tests (flags / permissions / core)
        working-directory: mgmt/frontend-svelte
        run: npm test

      - name: Static build (adapter-static)
        working-directory: mgmt/frontend-svelte
        # VITE_API_URL is required at build for import.meta.env; a placeholder is
        # fine here — the real value comes from Vercel env at deploy time.
        run: VITE_API_URL="https://example.invalid" npm run build

      # Same reasoning as the Public v6 budget above, different audience: this one is
      # staff-only, so the weight matters less per visitor — but it is also the app
      # that keeps growing, and it is already 1.66x the public portal.
      #
      # Its type-check is NOT yet fail-on-warning, unlike Public v6's: there are ~160
      # pre-existing svelte-check warnings here, mostly unassociated labels. Silencing
      # them is the accessibility work in W5, not something to bulk-suppress to turn a
      # gate on (carry-over C7).
      - name: Bound the client bundle
        working-directory: mgmt/frontend-svelte
        run: |
          set -e
          BYTES=$(find build/_app/immutable -name '*.js' -type f -printf '%s\n' | awk '{t+=$1} END {print t+0}')
          KB=$(awk -v b="$BYTES" 'BEGIN { printf "%.1f", b / 1000 }')
          BIGGEST=$(find build/_app/immutable -name '*.js' -type f -printf '%s %p\n' | sort -rn | head -1)
          echo "total client JS: ${KB} kB (${BYTES} bytes); largest chunk: ${BIGGEST}"
          echo "### mgmt SvelteKit client JS: ${KB} kB (largest chunk: ${BIGGEST%% *} B)" >> "$GITHUB_STEP_SUMMARY"
          # ~15% headroom over today's 999,841 B — a regression threshold, not a target.
          LIMIT_BYTES=1150000
          if [ "$BYTES" -gt "$LIMIT_BYTES" ]; then
            echo "::error::mgmt SvelteKit client JS is ${KB} kB, over the ${LIMIT_BYTES} byte budget."
            echo "Check what stopped being lazily imported."
            exit 1
          fi

  secrets:
    name: No real data or credentials committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The per-database dumps under mgmt/db/migration/ hold live PII — password
      # hashes, emails, mobile numbers, IP addresses. They are gitignored, and
      # this repo has been flagged for committing them before. .gitignore only
      # stops an *unstaged* file; `git add -f` bypasses it.
      - name: Real-data dumps are not tracked
        run: |
          set -e
          bad=0
          for f in collections core file_index loans_expenses logs misc templates whatsapp_index; do
            if git ls-files --error-unmatch "mgmt/db/migration/$f.sql" >/dev/null 2>&1; then
              echo "::error::mgmt/db/migration/$f.sql is TRACKED. It contains live PII and must be removed from the index and from history."
              bad=1
            fi
          done
          [ "$bad" -eq 0 ] && echo "no real-data dumps are tracked"

      # wrangler.toml is committed (it holds ids and non-secret vars). Secrets
      # belong in `wrangler secret put`, never in the file. This catches the
      # obvious paste.
      - name: No secret values pasted into wrangler.toml
        run: |
          set -e
          bad=0
          for f in mgmt/backend/wrangler.toml Public/backend/wrangler.toml; do
            # Long opaque values assigned to a name that looks like a credential.
            if grep -nEi '^[[:space:]]*(WHATSAPP_QUEUE_API_KEY|PASSWORD_SALT|DRIVE_OAUTH_CLIENT_SECRET|DRIVE_OAUTH_REFRESH_TOKEN|API_KEY|.*_SECRET|.*_TOKEN)[[:space:]]*=[[:space:]]*"[^"]{16,}"' "$f"; then
              echo "::error file=$f::a credential-looking value is assigned in wrangler.toml. Use 'wrangler secret put <NAME>' instead."
              bad=1
            fi
          done
          [ "$bad" -eq 0 ] && echo "no secrets assigned in wrangler.toml"
