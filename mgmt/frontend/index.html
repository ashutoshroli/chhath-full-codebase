<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- ==================================================================
       SEO / SOCIAL LINK PREVIEW (management portal)
       ------------------------------------------------------------------
       The block between SEO:START and SEO:END is regenerated at build
       time by build.mjs from the settings a Superadmin saves in this
       portal. The values here are the HARDCODED DEFAULTS used when the
       settings API is unreachable, so the deploy never fails.
       This is a private, login-only admin tool, so it is marked
       `noindex` — it should NOT appear in search results — but it still
       carries Open Graph / Twitter tags so the login link shows a proper
       preview when the committee shares it on WhatsApp.
       ================================================================== -->
  <!--SEO:START-->
  <title>Chhath Puja Management Portal</title>
  <meta name="description" content="Private management portal for Navyuvak Chhath Puja Samiti Shaharpura. Authorised committee members only.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#F97316">

  <!-- Open Graph (WhatsApp / Facebook) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Chhath Puja Management Portal">
  <meta property="og:title" content="Chhath Puja Management Portal">
  <meta property="og:description" content="Private management portal for Navyuvak Chhath Puja Samiti Shaharpura. Authorised committee members only.">
  <meta property="og:url" content="https://mgmt-chhath.shaharpura.com/">
  <meta property="og:image" content="https://mgmt-chhath.shaharpura.com/preview.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <!-- Twitter / X card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Chhath Puja Management Portal">
  <meta name="twitter:description" content="Private management portal for Navyuvak Chhath Puja Samiti Shaharpura. Authorised committee members only.">
  <meta name="twitter:image" content="https://mgmt-chhath.shaharpura.com/preview.jpg">
  <!--SEO:END-->

  <!-- PERFORMANCE: pre-connect to the font origins so the TLS/DNS handshake is
       already done by the time the CSS below is fetched (shaves LCP). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Fonts loaded NON-render-blocking: `media=print` + onload swap means the
       browser does NOT block first paint waiting for these stylesheets (they used
       to be plain render-blocking <link>s, a big chunk of the 3.5s LCP). Once
       loaded they apply normally. `display=swap` keeps text visible with a
       fallback font meanwhile (also reduces layout shift / CLS). A <noscript>
       fallback keeps fonts working with JS disabled. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Round&display=swap" media="print" onload="this.media='all'">
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Round">
  </noscript>

  <!-- Google Tag Manager — replace GTM-M2JP98W5 with your real container ID.
       GA4 and Microsoft Clarity are configured as tags INSIDE this GTM container.
       PERFORMANCE: loaded on window `load` (after first paint) so analytics never
       delays the LCP. The gtm.js script itself was already async; deferring the
       bootstrap to `load` keeps it fully off the critical rendering path while
       still capturing every pageview via the dataLayer trackers in the app. -->
  <script>
  window.dataLayer = window.dataLayer || [];
  window.addEventListener('load', function () {
    (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-M2JP98W5');
  });
  </script>
  <!-- End Google Tag Manager -->
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-M2JP98W5"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

  <div id="root"></div>
  <!-- `crossorigin` matters for the Error Log, not just for CORS: without it the
       browser hides every uncaught error from a differently-origined bundle behind
       the opaque message "Script error." with NO stack — the migrated error_log has
       five such useless rows. With it (plus Access-Control-Allow-Origin on the
       asset host, which Vercel already sends) window.onerror receives the real
       message and stack. -->
  <script type="module" crossorigin src="/src/main.jsx"></script>
</body>
</html>
