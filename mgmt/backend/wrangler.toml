name = "chhath-mgmt-api"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
# ⚠️ MUST be replaced with the real frontend domain before deploying.
# Every loan-consent WhatsApp link is built from this. It used to degrade
# silently (`env.CONSENT_BASE_URL || ''`) to a bare "/consent/<token>" path, so a
# misconfigured Worker sent DEAD links that were still recorded as `sent`.
# loans.js now refuses to send and raises a clear error while this still contains
# the placeholder value below.
CONSENT_BASE_URL = "https://mgmt-chhath.shaharpura.com"

# Optional CORS allow-list (comma-separated EXACT origins, e.g.
# "https://mgmt.example.com,https://admin.example.com"). When set, the API only
# reflects Access-Control-Allow-Origin for these origins; unknown origins are
# denied. Leave unset (or "*") to keep the previous wildcard behaviour.
# ALLOWED_ORIGINS = "https://YOUR-FRONTEND-DOMAIN.example.com"

# ---- R2 object storage (new uploads: consent photos/signatures, generated PDFs,
# popup images) ----
# Public base URL of the R2 bucket's custom domain. Set this to the domain you
# connect to the bucket (see README / PR steps). Until this is set AND the
# [[r2_buckets]] binding below exists, the code falls back to Google Drive, so
# nothing breaks. Files are served as `${R2_PUBLIC_BASE}/<key>`.
R2_PUBLIC_BASE = "https://files-chhath.shaharpura.com"

# ---- Secrets (set with `wrangler secret put NAME`, NOT here) ----
# PASSWORD_SALT
# WHATSAPP_QUEUE_API_KEY
# DRIVE_FOLDER_ID         (used by account.js's uploadFileToDrive — popups, consent photos/signatures)
# DRIVE_ROOT_FOLDER_ID    (used by docxTemplates.js — root folder that "DOCX Templates" and "Generated PDFs" live under)
#
# Drive auth is an OAuth REFRESH TOKEN (see account.js getDriveAccessToken(),
# KV-cached ~55 min), NOT a service account. The DRIVE_SA_EMAIL /
# DRIVE_SA_PRIVATE_KEY secrets this file used to document are read by NO code at
# all — the stale docs sent people chasing the wrong credential whenever the
# docx->pdf conversion failed. These are the names the code actually reads:
# DRIVE_OAUTH_CLIENT_ID
# DRIVE_OAUTH_CLIENT_SECRET
# DRIVE_OAUTH_REFRESH_TOKEN

[[kv_namespaces]]
binding = "KV_SESSIONS"
id = "fc720867ed48459bb723279a56767711"

# R2 bucket for uploaded files. Create the bucket first (see PR/setup steps):
#   wrangler r2 bucket create chhath-files
# then keep this binding. `binding = "R2_FILES"` is the name the code uses
# (env.R2_FILES). If the bucket doesn't exist yet, remove/comment this block so
# the Worker still deploys and falls back to Drive.
[[r2_buckets]]
binding = "R2_FILES"
bucket_name = "chhath-files"

[[d1_databases]]
binding = "DB_CORE"
database_name = "chhath-core"
database_id = "06edd936-b186-47f3-93fb-72f0dc840849"

[[d1_databases]]
binding = "DB_COLLECTIONS"
database_name = "chhath-collections"
database_id = "6a1fb670-ec32-457a-b90f-635b33afc67c"

[[d1_databases]]
