name = "chhath-mgmt-api"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Cron Trigger (FREE on all Workers plans) — drives the Collection Queue.
# Runs the scheduled() handler in src/index.js every minute; it processes any
# `pending` collection_jobs rows (PDF generation + WhatsApp queueing) that a
# save enqueued, so the save itself returns instantly. If this line is removed
# the queue simply stops draining — nothing else breaks.
[triggers]
# Was "* * * * *" (every minute = 1,440 invocations/day). On the free tier each
# tick reads D1 (queue poll) and periodically writes (retention), which — with the
# public D1-budget over-estimate — pushed the daily D1/KV counters high even at tiny
# real data volume. Every 3 minutes (480/day) cuts that ~3x. The trade-off is only
# latency: a queued WhatsApp/PDF job waits up to ~3 min instead of ~1 min. Nothing
# is dropped. shouldSweepNow() was updated to a WINDOW check so the hourly retention
# sweep still fires on this coarser schedule (an exact-minute match would be skipped).
crons = ["*/3 * * * *"]

[vars]
# ⚠️ MUST be replaced with the real frontend domain before deploying.
# Every loan-consent WhatsApp link is built from this. It used to degrade
# silently (`env.CONSENT_BASE_URL || ''`) to a bare "/consent/<token>" path, so a
# misconfigured Worker sent DEAD links that were still recorded as `sent`.
# loans.js now refuses to send and raises a clear error while this still contains
# the placeholder value below.
CONSENT_BASE_URL = "https://mgmt-chhath.shaharpura.com"

# CORS allow-list (comma-separated EXACT origins). When set, the API only
# reflects Access-Control-Allow-Origin for these origins; unknown origins are
# denied. Leaving it unset (or "*") falls back to the old wildcard, which lets
# ANY site on the internet script the API from a victim's browser.
# SECURITY (audit S4): locked to the real mgmt frontend origin. If the admin
# panel is also served from another origin (e.g. a vercel.app URL), add it here
# comma-separated, e.g. "https://mgmt-chhath.shaharpura.com,https://foo.vercel.app".
ALLOWED_ORIGINS = "https://mgmt-chhath.shaharpura.com"

# ---- R2 object storage (new uploads: consent photos/signatures, generated PDFs,
# popup images) ----
# Public base URL of the R2 bucket's custom domain. Set this to the domain you
# connect to the bucket (see README / PR steps). Until this is set AND the
# [[r2_buckets]] binding below exists, the code falls back to Google Drive, so
# nothing breaks. Files are served as `${R2_PUBLIC_BASE}/<key>`.
R2_PUBLIC_BASE = "https://files-chhath.shaharpura.com"

# ---- Sign in with Google ----
# The Google Cloud OAuth 2.0 **Web** client id used by "Sign in with Google" on
# the login screen. loginWithGoogle() (auth.js) verifies every Google ID token's
# `aud` claim against this value, so a token minted for any other app is rejected.
# It is a PUBLIC value (it ships in the frontend too, as VITE_GOOGLE_CLIENT_ID),
# so it lives here in [vars], not as a secret.
#
# If left blank, the code falls back to DRIVE_OAUTH_CLIENT_ID (same Google Cloud
# project), so Google sign-in can work without a new value — but set this
# explicitly to the Web client id whose "Authorized JavaScript origins" include
# https://mgmt-chhath.shaharpura.com. See GOOGLE_SIGNIN_SETUP.md.
GOOGLE_SIGNIN_CLIENT_ID = ""

# ---- Email (Resend) ----
# Collection notifications are also sent by email via Resend (see src/email.js).
# The Worker calls the Resend HTTPS API directly (no external poller). These two
# are PUBLIC config, so they live in [vars]; the API key is a secret (below).
#   RESEND_FROM      the verified sender ("From"). shaharpura.com is verified in
#                    Resend, so noreply@shaharpura.com works out of the box.
#   RESEND_REPLY_TO  where replies go (the official mailbox, chhath@shaharpura.com).
# If RESEND_API_KEY is not set, email is simply skipped (rows stay 'pending');
# nothing else is affected.
# Resend accepts a display name: "Name <email>". Replies to noreply mail now go
# to the official mailbox (chhath@shaharpura.com) instead of the committee Gmail.
RESEND_FROM = "Navyuvak Chhath Pooja Samiti <noreply@shaharpura.com>"
RESEND_REPLY_TO = "chhath@shaharpura.com"

# ---- Official mailbox (two-way, chhath@shaharpura.com) ----
# OFFICIAL_FROM      the From/Reply-To for the official mailbox (send + reply).
# RESEND_WEBHOOK_SECRET (secret, below) authenticates Resend's inbound receiving
#   webhook. Point Resend's webhook at:
#     https://<worker-host>/?inbound-email=<RESEND_WEBHOOK_SECRET>
#   (or send it as an X-Webhook-Secret header). The Worker fetches each inbound
#   email's body via Resend's Received Emails API using RESEND_API_KEY.
OFFICIAL_FROM = "Chhath Shaharpura Official <chhath@shaharpura.com>"

# ---- AI auto-fix (Error Log "Fix using AI") — NON-secret config ----
# The repo the fix runs against, "owner/repo". Fine-grained GITHUB_TOKEN (secret,
# below) must be scoped to ONLY this repo.
GITHUB_REPO = "ashutoshroli/chhath-full-codebase"
# Auto-merge a PR once CI passes? Kept "false" by design: AI code can be CI-green
# but behaviourally wrong, so it must be human-reviewed unless a Superadmin
# deliberately turns this on. (CI monitoring + this flag are used in the follow-up
# CI-retry step; harmless to set now.)
AUTO_MERGE_ENABLED = "false"
# Claude model for the fix. Overridable so the exact string can be updated without
# a code change. Falls back to a valid Sonnet default in src/aiFix.js.
AI_FIX_MODEL = "claude-sonnet-4-5-20250929"

# ---- Render offload (long-running AI fix generation + PR creation) ----
# The Worker POSTs jobs to this Render service and Render calls back with the
# result. NON-secret (it's just a URL), so it lives here. Replace with your real
# Render service URL after deploying mgmt/server-render (see its README).
# The two shared secrets are set with `wrangler secret put` (below), never here.
RENDER_SERVICE_URL = "https://chhath-server-render.onrender.com"

# ---- Secrets (set with `wrangler secret put NAME`, NOT here) ----
# ANTHROPIC_API_KEY       (Claude API key for src/aiFix.js — `wrangler secret put ANTHROPIC_API_KEY`)
# GITHUB_TOKEN            (fine-grained PAT scoped to GITHUB_REPO ONLY — Contents R/W,
#                          Pull requests R/W, Actions: Read, Checks: Read — `wrangler secret put GITHUB_TOKEN`)
# GITHUB_WEBHOOK_SECRET   (verifies GitHub check_suite webhook signatures — used in the CI-retry step)
# AI_CONFIG_SECRET        (AES-GCM key for encrypting AI-provider API keys stored in the AI Management tab —
#                          `wrangler secret put AI_CONFIG_SECRET`, any strong random string.
#                          ⚠️ If lost/rotated, previously-saved provider keys can't be decrypted and must be re-entered.)
# PASSWORD_SALT
# WHATSAPP_QUEUE_API_KEY
# RESEND_API_KEY          (Resend API key for src/email.js + official mailbox — `wrangler secret put RESEND_API_KEY`)
# RESEND_WEBHOOK_SECRET   (shared secret for the inbound-email webhook — `wrangler secret put RESEND_WEBHOOK_SECRET`)
# RENDER_API_KEY          (shared secret Worker->Render; sent as X-Render-Api-Key on every job POST.
#                          Same value must be set in the Render service's env — `wrangler secret put RENDER_API_KEY`)
# RENDER_WEBHOOK_SECRET   (shared secret Render->Worker; Render sends it and the ?render-webhook route verifies it
#                          constant-time. DISTINCT from RENDER_API_KEY — `wrangler secret put RENDER_WEBHOOK_SECRET`)
# DRIVE_FOLDER_ID         (used by account.js's uploadFileToDrive — popups, consent photos/signatures)
# DRIVE_ROOT_FOLDER_ID    (used by docxTemplates.js — root folder that "DOCX Templates" and "Generated PDFs" live under)
#
# Drive auth is an OAuth REFRESH TOKEN (see account.js getDriveAccessToken(),
# KV-cached ~55 min), NOT a service account. The DRIVE_SA_EMAIL /
# DRIVE_SA_PRIVATE_KEY secrets this file used to document are read by NO code at
# all — the stale docs sent people chasing the wrong credential whenever the
# docx->pdf conversion failed. These are the names the code actually reads:
# DRIVE_OAUTH_CLIENT_ID
# DRIVE_OAUTH_CLIENT_SECRET
# DRIVE_OAUTH_REFRESH_TOKEN

[[kv_namespaces]]
binding = "KV_SESSIONS"
id = "fc720867ed48459bb723279a56767711"

# R2 bucket for uploaded files. Create the bucket first (see PR/setup steps):
#   wrangler r2 bucket create chhath-files
# then keep this binding. `binding = "R2_FILES"` is the name the code uses
# (env.R2_FILES). If the bucket doesn't exist yet, remove/comment this block so
# the Worker still deploys and falls back to Drive.
[[r2_buckets]]
binding = "R2_FILES"
bucket_name = "chhath-files"

